name: Android Helper APK

# Builds the Sahara OS Helper app (android/) on a GitHub runner — the Android SDK is preinstalled there — and publishes the APK as
# a workflow artifact (Actions → this run → Artifacts → sahara-os-helper-debug-apk). Runs on every change to android/ and on demand.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-helper.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Source manifest asks for no SMS / OTP / phone-state / location / microphone / camera permission
        run: |
          if grep -nE "READ_SMS|RECEIVE_SMS|SEND_SMS|RECEIVE_MMS|RECEIVE_WAP_PHONE|READ_PHONE_STATE|READ_PHONE_NUMBERS|READ_CONTACTS|ACCESS_.*LOCATION|RECORD_AUDIO|CAMERA" android/app/src/main/AndroidManifest.xml; then
            echo "::error::forbidden permission in AndroidManifest.xml"; exit 1
          fi

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Final permission list of the built APK (merged manifest) — no SMS anywhere
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -iE "sms|mms|wap_push|phone_state|phone_numbers|contacts|location|record_audio|camera" permissions.txt; then
            echo "::error::the built APK requests a forbidden permission"; exit 1
          fi
          ls -l "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: sahara-os-helper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
