name: Daily WhatsApp Reminders

on:
  schedule:
    # 09:00 Asia/Kolkata (IST = UTC+5:30) -> 03:30 UTC.
    - cron: "30 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: sahara-os-reminders
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run reminder sweep
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            "${CRON_URL}"
