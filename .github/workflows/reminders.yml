name: Daily WhatsApp Reminders

on:
  schedule:
    # 09:00 Asia/Kolkata (IST = UTC+5:30) -> 03:30 UTC.
    - cron: "30 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: sahara-os-reminders
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CRON_URL/CRON_TOKEN have never been provisioned as repo secrets, so
    # this workflow failed every day with "curl: (3) URL rejected:
    # Malformed input to a URL function" (an empty URL) — a missing-secret
    # problem, not a WhatsApp Cloud API problem. WhatsApp itself is a
    # separate, still-disconnected integration (Settings -> Integrations in
    # the app) and is untouched here. Skips gracefully (not a failure)
    # until both secrets are set, exactly like the optional destinations in
    # backup.yml — no credentials invented, no messages sent either way.
    env:
      HAS_CRON: ${{ secrets.CRON_URL != '' && secrets.CRON_TOKEN != '' }}
    steps:
      - name: Run reminder sweep
        if: ${{ env.HAS_CRON == 'true' }}
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            "${CRON_URL}"

      - name: Skipped — CRON_URL/CRON_TOKEN not configured yet
        if: ${{ env.HAS_CRON != 'true' }}
        run: |
          echo "::notice::Reminder sweep skipped: CRON_URL/CRON_TOKEN are not set as repo secrets yet. This is expected until the cron endpoint is wired up - no message was sent. Automation will resume automatically once both secrets exist."
