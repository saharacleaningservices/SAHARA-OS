name: Sahara OS Enterprise Backup

on:
  schedule:
    # 02:00 Asia/Kolkata (IST = UTC+5:30) -> 20:30 UTC the previous day.
    # GitHub may start scheduled runs several minutes late under load.
    - cron: "30 20 * * *"
  workflow_dispatch: {}

# GITHUB_TOKEN only needs to read the repo and open/close the "backup failed" issue.
permissions:
  contents: read
  issues: write

concurrency:
  group: sahara-os-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download snapshot from the live app
        env:
          BACKUP_URL: ${{ secrets.BACKUP_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail
          stamp="$(TZ=Asia/Kolkata date +%Y%m%d-%H%M%S)"
          file="sahara-os-${stamp}.tar.gz"
          echo "ARCHIVE=$file" >> "$GITHUB_ENV"
          curl -fsSL --retry 4 --retry-delay 15 --retry-all-errors --max-time 600 \
            -H "Authorization: Bearer ${BACKUP_TOKEN}" \
            "${BACKUP_URL}" -o "$file"
          # Fail loudly if we got an HTML error/login page instead of an archive.
          file "$file" | grep -q 'gzip compressed' || { echo "::error::download is not a gzip archive"; head -c 500 "$file"; exit 1; }
          tar -tzf "$file" >/dev/null
          ls -lh "$file"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Delivery to Google Drive is mandatory: fail early with a clear message (no secret values printed) if the
      # credentials/folder id are missing or malformed.
      - name: Require Google Drive delivery configuration
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python .github/scripts/gdrive_backup.py --check-config

      - name: Verify backup integrity (stdlib sqlite3 — must pass before upload)
        run: python .github/scripts/verify_backup.py "$ARCHIVE"

      - name: Install Google API client
        run: pip install --quiet google-api-python-client google-auth

      # gdrive_backup.py re-reads the uploaded file from Drive and fails unless its size equals the local archive.
      - name: Upload to Google Drive, verify size, apply daily/monthly retention
        id: drive_upload
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          KEEP_DAILY: "30"
          KEEP_MONTHLY: "12"
        run: python .github/scripts/gdrive_backup.py "$ARCHIVE"

      # Tell the CRM the archive was delivered AND size-verified in Drive; the CRM's stale-backup alert (26 h)
      # measures these confirmations. Non-fatal on purpose (rollout order must never turn a good backup into a failed
      # run); if it ever fails the CRM raises the stale alert after 26 h.
      - name: Confirm delivery to the CRM
        if: ${{ steps.drive_upload.conclusion == 'success' }}
        continue-on-error: true
        env:
          BACKUP_URL: ${{ secrets.BACKUP_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail
          size="$(stat -c %s "$ARCHIVE")"
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 -X POST \
            -H "Authorization: Bearer ${BACKUP_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"fileName\":\"${ARCHIVE}\",\"sizeBytes\":${size},\"destination\":\"google-drive\"}" \
            "${BACKUP_URL%/}/confirm"

      # Runs whether the job succeeded or a step above failed — the app's own
      # BackupEvent logging (src/app/api/backup/route.ts) only knows about
      # the download step; this is the one place that can also see a failure
      # in verification, the Google Drive upload, or retention cleanup, and
      # surface it somewhere a human will actually notice it (the run's
      # summary tab) instead of only in the raw job log.
      - name: Report outcome
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Backup **succeeded** — \`${ARCHIVE:-unknown}\` verified and uploaded to Google Drive." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Backup **failed** — see the job log above for which step failed (archive: \`${ARCHIVE:-not downloaded}\`)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Any failed step above opens ONE GitHub Issue labelled backup-failure (repeat failures comment on it; GitHub
      # e-mails the repo watchers). The next good run closes it. Built-in GITHUB_TOKEN only.
      - name: Alert - backup failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/backup_alert.sh failure

      - name: Clear alert - backup delivered
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/backup_alert.sh success
