openapi: 3.0.3
info:
  title: Sahara OS Public API v1 (DRAFT — not implemented)
  version: 1.0.0-draft
  description: |
    Thin REST layer that lets the separate marketing website (www) create leads in, and read public data from,
    the Sahara OS CRM. **Status: specification only. Nothing here exists in the CRM yet.** Implementing it needs
    owner approval; until `PUBLIC_API_TOKEN` is set the endpoints must answer 404 (inert).

    Design rules
    * Server-to-server only: the website's server calls the CRM; the browser never does (no CORS, no key in the browser).
    * Lead creation reuses the existing `publicBookLead` logic unchanged (see
      `tests/public-booking-characterisation.test.ts` for the behaviour it must keep): validation, honeypot,
      per-IP and per-mobile throttling, slot re-check, duplicate matching by mobile, **server-side re-pricing**,
      request-acknowledgement WhatsApp (TEST mode until the owner approves live), staff alert.
    * The website holds **no pricing logic**: prices, strike-through and badges come ready-made from the CRM, so the
      "never show a misleading price" rule lives in one place.
    * Secrets (`PUBLIC_API_TOKEN`, `PUBLIC_API_HMAC_SECRET`) are entered by the owner in Coolify. They never appear in
      code, docs or chat.
servers:
  - url: https://crm.saharacleaningservices.com/api/public/v1
    description: Production (when approved)
security:
  - bearerAuth: []
    hmacSignature: []
paths:
  /leads:
    post:
      operationId: createLead
      summary: Submit a booking / enquiry from the website
      description: |
        Equivalent to today's `publicBookLead` server action. A repeat submission for the same mobile + service
        updates the open enquiry instead of creating a duplicate (same `leadNumber` returned).
        Send an `Idempotency-Key` so a network retry can never double-submit.
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per submission (UUID). A repeat with the same key returns the first response.
          schema: { type: string, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadRequest' }
      responses:
        '200':
          description: Lead created or updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadResponse' }
        '400':
          description: Validation failed. `error` is the same customer-facing message the booking form shows today.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The requested slot has just filled up, or a selected package is no longer available. Ask the customer to choose again.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooMany' }
        '503':
          description: CRM temporarily unavailable. The website must show call / WhatsApp click-to-chat as the fallback.
  /catalogue:
    get:
      operationId: getCatalogue
      summary: Services, packages and display-ready prices
      description: |
        Final display model computed by the CRM's pricing master. `price` is the amount payable for the requested
        `serviceDate` (festival price only when that date is inside a festival window). `strikePrice` is non-null
        **only** when a genuinely higher regular price exists; otherwise null and `badge` may say "Festival special".
        Painting is never priced publicly (free site inspection first); 4 BHK+/villas are inspection-only.
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
        - name: serviceDate
          in: query
          required: false
          description: YYYY-MM-DD (IST). Defaults to today.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        '200':
          description: Catalogue. Cacheable.
          headers:
            Cache-Control: { schema: { type: string, example: 's-maxage=60, stale-while-revalidate=300' } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /slots:
    get:
      operationId: getSlots
      summary: Slot availability (customer-visible only)
      description: |
        Wraps `getDateAvailability` / `getSlotAvailability`. Returns only OPEN / FILLING / FULL per day and
        available / full per slot — never booking counts, teams or capacity.
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
        - name: date
          in: query
          description: A single day (YYYY-MM-DD). Omit to get the next `days` days.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: days
          in: query
          description: Number of days from today (default 21, clamped to 1-45 by the CRM).
          schema: { type: integer, minimum: 1, maximum: 45, default: 21 }
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slots' }
        '400':
          description: Invalid date.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # /reviews — DEFERRED, deliberately not part of v1.
  #   The CRM `Review` table stores `customerMobile` and has no "OK to publish" flag. Exposing it needs a schema change
  #   (prisma/schema.prisma AND scripts/db-setup.mjs), a consent policy, and returning only first name + rating + comment.
  #   Owner decision first. Until then the website shows only the Google reviews link / verified ratings the owner supplies.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <PUBLIC_API_TOKEN>` — fails closed (401) when the token is unset or wrong. Constant-time compare.'
    hmacSignature:
      type: apiKey
      in: header
      name: X-Sahara-Signature
      description: |
        `sha256=<hex>` = HMAC-SHA256 of `"<X-Sahara-Timestamp>.<raw request body>"` (empty body for GET) with
        `PUBLIC_API_HMAC_SECRET`. The timestamp must be within ±300 s (replay window). Same scheme as the existing
        `/api/webhook/email-lead` route.
  parameters:
    Timestamp:
      name: X-Sahara-Timestamp
      in: header
      required: true
      description: Unix seconds.
      schema: { type: string, pattern: '^\d{9,11}$' }
    Signature:
      name: X-Sahara-Signature
      in: header
      required: true
      schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
  responses:
    Unauthorized:
      description: Missing/invalid token or signature, or timestamp outside the ±300 s window.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooMany:
      description: Throttled (10 requests per visitor IP and 5 per mobile number per 10 minutes — values of the current action).
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Customer-safe message. }
        code:
          type: string
          description: Machine-readable code (new in the API; the server action returns only `error`).
          enum: [VALIDATION, HONEYPOT, THROTTLED, SLOT_FULL, PACKAGE_UNAVAILABLE, FESTIVAL_DATE_REQUIRED, UNAUTHORIZED, UNAVAILABLE]
    LeadResponse:
      type: object
      required: [success, leadNumber]
      properties:
        success: { type: boolean, enum: [true] }
        leadNumber: { type: string, description: Customer-visible request ID (also in the acknowledgement message). }
    LeadRequest:
      description: Mirrors `publicBookingSchema` in `src/server/actions/public-booking.ts`; limits are the current server limits.
      type: object
      required: [name, mobile, serviceCategory]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        mobile: { type: string, maxLength: 20, description: 'Indian mobile; the last 10 digits must match ^[6-9][0-9]{9}$.' }
        alternateMobile: { type: string, maxLength: 15 }
        email: { type: string, format: email, maxLength: 120 }
        area: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 400 }
        pinCode: { type: string, maxLength: 10 }
        serviceCategory:
          type: string
          maxLength: 60
          description: One of HOME_DEEP_CLEANING, INDIVIDUAL_CLEANING, PAINTING, PEST_CONTROL, HOUSEKEEPING, COMMERCIAL_CLEANING, AMC, CUSTOMIZER_PACKAGE, COMBO_PACKAGE.
        serviceVariant: { type: string, maxLength: 120 }
        propertyType: { type: string, maxLength: 60, description: "4 BHK and larger, Villa, Bungalow, Other => inspection quote, no instant price." }
        packageName: { type: string, maxLength: 120 }
        comboServices: { type: array, maxItems: 30, items: { type: string, maxLength: 120 } }
        addOnServices: { type: array, maxItems: 30, items: { type: string, maxLength: 120 } }
        selectedItems:
          type: array
          maxItems: 30
          description: Catalogue items picked. The CRM re-prices these; any total sent by the browser is ignored.
          items:
            type: object
            required: [contentId, qty]
            properties:
              contentId: { type: string, maxLength: 40 }
              qty: { type: integer, minimum: 1, maximum: 100 }
        priceType: { type: string, enum: [REGULAR, FESTIVAL], description: Informational; the CRM decides from the service date. }
        estimatedAmount: { type: number, minimum: 0, maximum: 10000000, description: IGNORED for pricing; kept only as an "unverified" staff note. }
        advancePaid: { type: boolean, description: A claim only — never marks anything paid. }
        advanceAmount: { type: number, minimum: 0, maximum: 10000000, description: A claim only. }
        paymentMode: { type: string, enum: [UPI, QR, BANK, CASH] }
        paymentPreference: { type: string, enum: [PAY_ADVANCE, PAY_AFTER_SERVICE] }
        serviceDate: { type: string, maxLength: 40, description: 'Real calendar date (IST), today or later.' }
        timeSlot: { type: string, maxLength: 40, description: Re-checked against live availability on submit. }
        notes: { type: string, maxLength: 2000 }
        mapLink: { type: string, maxLength: 600 }
        source: { type: string, maxLength: 40, description: Customer's own "how did you hear" answer; wins over the detected channel. }
        referralCode: { type: string, maxLength: 40 }
        bookingLinkToken: { type: string, maxLength: 64 }
        quotationToken: { type: string, maxLength: 64, description: Booking from a quotation link (separate path in the CRM). }
        upsellRuleId: { type: string, maxLength: 40, description: 'Combo/upsell rule offered on the booking page; the CRM records the rule''s OWN label and price.' }
        upsellLabel: { type: string, maxLength: 120, description: Ignored; the rule's own label is recorded. }
        upsellValue: { type: number, minimum: 0, maximum: 10000000, description: Ignored server-side. }
        upsellAccepted: { type: boolean }
        marketingOptIn: { type: boolean, description: Explicit WhatsApp marketing opt-in ticked by the customer; never pre-ticked. }
        website: { type: string, maxLength: 200, description: HONEYPOT — hidden field; must stay empty. }
        attribution:
          type: object
          description: First/latest-touch marketing attribution captured in the visitor's browser (sanitised by the CRM).
          properties:
            first: { $ref: '#/components/schemas/Touch' }
            latest: { $ref: '#/components/schemas/Touch' }
        client:
          type: object
          description: Added by the website server so per-visitor throttling still works (covered by the HMAC signature).
          required: [ip]
          properties:
            ip: { type: string, maxLength: 64 }
            userAgent: { type: string, maxLength: 300 }
    Touch:
      type: object
      properties:
        source: { type: string, maxLength: 200 }
        medium: { type: string, maxLength: 200 }
        campaign: { type: string, maxLength: 200 }
        term: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 200 }
        gclid: { type: string, maxLength: 300 }
        fbclid: { type: string, maxLength: 300 }
        referrer: { type: string, maxLength: 500 }
        landingPage: { type: string, maxLength: 200 }
        landingPageUrl: { type: string, maxLength: 1000 }
        at: { type: string, maxLength: 40 }
    Catalogue:
      type: object
      required: [version, serviceDate, items]
      properties:
        version: { type: string, description: Hash of the catalogue; changes when any price/festival window changes. }
        serviceDate: { type: string, description: The date these prices apply to (YYYY-MM-DD). }
        festival:
          nullable: true
          description: Festival window covering `serviceDate`, if any.
          type: object
          properties:
            name: { type: string }
            start: { type: string }
            end: { type: string }
        banner:
          nullable: true
          type: object
          description: Urgency banner text from the CRM's festival-urgency logic (null outside the demand window).
          properties:
            headline: { type: string }
            detail: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogueItem' }
    CatalogueItem:
      type: object
      required: [contentId, name, category, group]
      description: Derived from the CRM `PriceItem` plus the honest-pricing display fields.
      properties:
        contentId: { type: string, example: SCS-01 }
        name: { type: string }
        category: { type: string, enum: [HOME_DEEP_CLEANING, INDIVIDUAL_CLEANING, COMBO_PACKAGE, COMMERCIAL_CLEANING, PEST_CONTROL, PAINTING] }
        group: { type: string, enum: [PREMIUM, PLATINUM, CUSTOMISED, COMBO, PAINTING, PEST, COMMERCIAL] }
        variant: { type: string }
        bhk: { type: string }
        unit: { type: string, description: 'e.g. "per seat"; present means quantity-based.' }
        minQty: { type: integer }
        addOnOnly: { type: boolean }
        price: { type: number, nullable: true, description: Amount payable for `serviceDate`; null = no public price (see `priceNote`). }
        strikePrice: { type: number, nullable: true, description: Non-null ONLY when a genuinely higher regular price exists. }
        savings: { type: number, nullable: true }
        badge: { type: string, nullable: true, description: 'e.g. "Festival special"; never implies a discount that is not real.' }
        priceNote: { type: string, nullable: true, description: 'Shown instead of a price, e.g. "Free site inspection".' }
        inspectionOnly: { type: boolean }
        scope: { type: string, nullable: true, description: Written scope of work for this item. }
    Slots:
      type: object
      properties:
        days:
          type: array
          description: Present when `date` is omitted.
          items:
            type: object
            properties:
              date: { type: string }
              status: { type: string, enum: [OPEN, FILLING, FULL] }
        date: { type: string, description: Present when `date` was requested. }
        isFull: { type: boolean }
        label: { type: string }
        slots:
          type: array
          items:
            type: object
            properties:
              slot: { type: string, example: 10:00 AM - 12:00 PM }
              available: { type: boolean }
